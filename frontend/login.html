<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — SignConnect AI</title>
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-layout="public" data-page="login">
  <div id="site-header"></div>

  <main class="auth-wrap">
    <div class="card auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to see your dashboard and recognition history.</p>

      <form id="login-form" novalidate>
        <div id="login-alert" class="form-alert" hidden></div>

        <div class="field">
          <label for="email">Email address</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
          <div class="field-error" data-error-for="email"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" data-target="password" aria-pressed="false">Show</button>
          </div>
          <div class="field-error" data-error-for="password"></div>
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
      </form>

      <p class="auth-foot">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
